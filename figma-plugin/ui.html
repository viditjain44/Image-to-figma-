<style>
  body { font: 12px Inter, system-ui, sans-serif; margin: 12px; color: #111; }
  h3 { margin: 14px 0 6px; font-size: 12px; }
  #drop { border: 1.5px dashed #bbb; border-radius: 8px; padding: 18px; text-align: center; color: #666; cursor: pointer; }
  #drop.over { border-color: #0D99FF; background: #F0F8FF; }
  #drop img { max-width: 100%; max-height: 140px; border-radius: 4px; }
  .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { background: #0D99FF; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #eee; color: #111; }
  button:disabled { opacity: .5; cursor: default; }
  #log { background: #f5f5f5; border-radius: 6px; padding: 8px; height: 90px; overflow: auto; white-space: pre-wrap; font: 11px Menlo, monospace; }
  .job { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .job img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
  .job span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style>

<div id="drop">Drop, paste (⌘V) or click to pick an image<input id="file" type="file" accept="image/*" hidden></div>
<div class="row">
  <label><input type="checkbox" id="cutout" checked> Cut out subject</label>
  <label><input type="checkbox" id="llm" checked> AI labels</label>
  <label title="Scale text so each block is as wide as in the original (fixes size differences between fonts)"><input type="checkbox" id="fit" checked> Match widths</label>
  <label>Scale <select id="scale"><option value="1">1×</option><option value="2">2× (retina)</option></select></label>
</div>
<div class="fonts">
  <label>Sans font <input type="text" id="sans" value="Inter"></label>
  <label>Serif font <input type="text" id="serif" value="Playfair Display"></label>
</div>
<div class="row"><button id="go" disabled>Convert &amp; import</button><span id="status"></span></div>
<div id="log"></div>

<h3>Recent conversions</h3>
<div id="jobs"></div>

<script>
const API = "http://localhost:8001";
const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent += m + "\n"; $("log").scrollTop = 1e9; };
let picked = null;

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

function pick(file) {
  if (!file || !file.type.startsWith("image/")) return;
  picked = file;
  $("drop").innerHTML = `<img src="${URL.createObjectURL(file)}"><div>${file.name}</div>`;
  $("go").disabled = false;
}
$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => pick(e.target.files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); pick(e.dataTransfer.files[0]); };
document.onpaste = (e) => {
  const item = [...e.clipboardData.items].find((i) => i.type.startsWith("image/"));
  if (item) pick(new File([item.getAsFile()], "pasted.png", { type: item.type }));
};

$("go").onclick = async () => {
  if (!picked) return;
  const options = { cutout_subject: $("cutout").checked, use_llm: $("llm").checked, scale: +$("scale").value,
    sans_font: $("sans").value.trim() || "Inter", serif_font: $("serif").value.trim() || "Playfair Display" };
  const form = new FormData();
  form.append("image", picked, picked.name);
  form.append("options", JSON.stringify(options));
  $("go").disabled = true; $("log").textContent = "";
  try {
    const { job_id } = await api("/convert", { method: "POST", body: form });
    let seen = 0;
    while (true) {
      await new Promise((r) => setTimeout(r, 1500));
      const job = await api(`/jobs/${job_id}`);
      job.log.slice(seen).forEach(log); seen = job.log.length;
      $("status").textContent = job.status;
      if (job.status === "done") { await importDoc(job.document); break; }
      if (job.status === "error") { log("Error: " + job.error); break; }
    }
  } catch (e) { log("Cannot reach the server. Is `uv run img-to-figma serve` running?\n" + e); }
  $("go").disabled = false; refresh();
};

async function importDoc(doc) {
  const images = {};
  for (const l of doc.layers)
    for (const src of [l.type === "image" ? l.src : "", l.icon_src || ""])
      if (src && !images[src])
        images[src] = new Uint8Array(await (await fetch(`${API}/files/${src}`)).arrayBuffer());
  parent.postMessage({ pluginMessage: { type: "import", doc, images, fitWidths: $("fit").checked } }, "*");
  log(`Importing ${doc.layers.length} layers…`);
}

async function refresh() {
  try {
    const jobs = await api("/jobs");
    $("jobs").innerHTML = jobs.length ? "" : "<i>None yet</i>";
    for (const j of jobs) {
      const row = document.createElement("div"); row.className = "job";
      row.innerHTML = `<img src="${API}/files/${j.thumb}"><span title="${j.name}">${j.name} · ${j.layers} layers</span>`;
      const b = document.createElement("button"); b.className = "secondary"; b.textContent = "Import";
      b.onclick = async () => importDoc((await api(`/jobs/${j.job_id}`)).document);
      row.appendChild(b); $("jobs").appendChild(row);
    }
  } catch (e) { $("jobs").textContent = "Server not running: uv run img-to-figma serve"; }
}

onmessage = (e) => {
  const m = e.data.pluginMessage || {};
  if (m.type === "imported") log("Imported ✓" + (m.missing.length ? ` (missing fonts: ${m.missing.join(", ")})` : ""));
  if (m.type === "error") log("Import failed: " + m.message);
};
refresh();
</script>
